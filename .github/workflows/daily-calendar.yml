name: Daily high-impact news

on:
  schedule:
    # 22:10 UTC = 00:10 SAST (Africa/Johannesburg, GMT+2, no daylight saving)
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: read
  actions: write   # only used by the keep-alive step below

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's calendar to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ_NAME: Africa/Johannesburg
        run: python post_calendar.py

      # GitHub pauses scheduled workflows in public repos after 60 days with no
      # activity. Re-enabling the workflow once a month keeps the schedule alive.
      - name: Keep schedule alive (1st of each month)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Africa/Johannesburg date +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-calendar.yml/enable" && echo "Keep-alive done"
          fi
