name: Daily high-impact news

on:
  schedule:
    # 22:10 UTC = 00:10 SAST (Africa/Johannesburg, GMT+2, no daylight saving)
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's calendar to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ_NAME: Africa/Johannesburg
        run: python post_calendar.py
